server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fiks-crm-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/fikscrm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-signing-min-32-chars}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.fikscrm: DEBUG
    org.springframework.security: DEBUG
